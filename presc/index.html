<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../images/presc.svg" />
  <title>PRESC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:   #5fd3b9;
      --bg:       #040403;
      --surface:  rgba(15, 16, 19, 0.98);
      --border:   rgba(255, 255, 255, 0.08);
      --text:     #e5e5e5;
      --muted:    #777;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background:
        radial-gradient(circle at top, rgba(95,211,185,0.15), transparent 40%),
        var(--bg);
      font-family: 'Ubuntu', Inter, system-ui, -apple-system, sans-serif;
      color: var(--text);
      text-rendering: optimizeLegibility;
    }

    /* ── Logo ──────────────────────────────────────────────── */
    .logo-wrap {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Wordmark ──────────────────────────────────────────── */
    .wordmark {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 8px;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 48px;
    }

    /* ── Cards ─────────────────────────────────────────────── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: min(100%, 360px);
    }

    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
    }

    .card:hover {
      border-color: rgba(95,211,185,0.35);
      box-shadow: 0 8px 32px rgba(95,211,185,0.08);
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 2rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .card-title span { color: var(--accent); }

    .card-desc {
      margin-top: 3px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .card-arrow {
      color: var(--muted);
      font-size: 1.2rem;
      flex-shrink: 0;
      transition: color 0.15s, transform 0.15s;
    }

    .card:hover .card-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img src="../images/presc.svg" alt="PRESC logo" />
  </div>

  <h1 class="wordmark">PRESC</h1>
  <p class="tagline">Pick your app</p>

  <nav class="cards" aria-label="PRESC apps">

    <a href="./weight/" class="card">
      <span class="card-icon">⚖️</span>
      <div class="card-body">
        <div class="card-title">PRESC <span>Weight</span></div>
        <div class="card-desc">Track &amp; compare weight progress</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a href="./flix/" class="card">
      <span class="card-icon">🎬</span>
      <div class="card-body">
        <div class="card-title">PRESC<span>FLIX</span></div>
        <div class="card-desc">Our film queue &amp; watched list</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

  </nav>

</body>
</html>
