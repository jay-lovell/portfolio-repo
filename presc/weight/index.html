<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../../images/presc.svg" />
  <link rel="stylesheet" href="../../main.css" />
  <link rel="stylesheet" href="./weightcalc.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>PRESC Weight Change Calculator</title>
</head>
<body>
  <main class="page-shell" aria-label="Weight change calculator">
    <a href="/presc/" class="weight-back" aria-label="Back to PRESC">&#8592; PRESC</a>
    <section class="brand-bar">
      <div class="brand-logo-wrap">
        <img src="../../images/presc.svg" alt="PRESC logo" class="brand-logo" />
      </div>
      <h1>PRESC Weight Change Calculator</h1>
      <p class="intro">Choose one measurement system and enter both weights in that same unit.</p>
    </section>

    <div class="unit-switcher">
      <label for="user-select">Select User</label>
      <select id="user-select" aria-label="Select user" required>
        <option value="" disabled selected>Please select</option>
        <option value="Sarah">Sarah</option>
        <option value="Jay">Jay</option>
      </select>
    </div>

    <div class="unit-switcher">
      <label for="measurement-date">Week Commencing</label>
      <input id="measurement-date" type="date" min="2025-01-06" step="7" />
    </div>

    <div class="unit-switcher">
      <label for="weight-unit">Input Units</label>
      <select id="weight-unit" aria-label="Weight input units" required>
        <option value="st-lb" selected>Stones & Pounds</option>
        <option value="lb">Pounds</option>
        <option value="kg">Kilograms</option>
      </select>
    </div>

    <a href="./setup.html" class="note-text" style="display: block; color: #5fd3b9; text-decoration: none; margin-bottom: 16px;">→ Update Starting Weight</a>
    <a href="./chart.html" class="note-text" style="display: block; color: #5fd3b9; text-decoration: none; margin-bottom: 16px;">→ View Competition Chart</a>

    <section class="input-grid">

      <div class="weight-card">
        <h2>Today's Weight</h2>
        <div class="field-group">
          <div id="today-stlb" class="row columns-2">
            <div>
              <label for="today-stones">Stones</label>
              <input id="today-stones" type="number" min="0" step="1" inputmode="numeric" placeholder="st" />
            </div>
            <div>
              <label for="today-pounds">Pounds</label>
              <input id="today-pounds" type="number" min="0" step="0.1" inputmode="decimal" placeholder="lb" />
            </div>
          </div>

          <div id="today-lb" class="field-group" hidden>
            <label for="today-pounds-only">Pounds</label>
            <input id="today-pounds-only" type="number" min="0" step="0.1" inputmode="decimal" placeholder="lbs" />
          </div>

          <div id="today-kg" class="field-group" hidden>
            <label for="today-kilograms">Kilograms</label>
            <input id="today-kilograms" type="number" min="0" step="0.1" inputmode="decimal" placeholder="kg" />
          </div>
        </div>
      </div>
    </section>

    <button class="calculate-button" id="calculate-btn" type="button">Calculate</button>

    <div id="result" class="result-box" hidden>
      <p class="result-copy">Cumulative change from your starting weight</p>
      <p id="result-text" class="result-value"></p>
    </div>

    <div id="chart-container" class="result-box" hidden>
      <canvas id="weightChart"></canvas>
    </div>
  </main>

  <script type="module">
    import {
      db, loadStartingWeight, loadWeightData, saveWeight,
      renderChart, parseWeightInputs
    } from './presc.js';

    function currentWeekMonday() {
      const today = new Date();
      const day = today.getDay();              // 0 = Sun … 6 = Sat
      const offset = day === 0 ? -6 : 1 - day; // roll back to Monday
      const mon = new Date(today);
      mon.setDate(today.getDate() + offset);
      return mon.toLocaleDateString('en-CA');  // YYYY-MM-DD
    }

    const weightUnit       = document.getElementById('weight-unit');
    const userSelect       = document.getElementById('user-select');
    const measurementDate  = document.getElementById('measurement-date');
    const resultContainer  = document.getElementById('result');
    const resultText       = document.getElementById('result-text');
    const chartContainer   = document.getElementById('chart-container');
    let startingWeightKg   = null;

    measurementDate.value = currentWeekMonday();

    measurementDate.addEventListener('change', () => {
      if (!measurementDate.value) return;
      const d = new Date(measurementDate.value + 'T00:00:00');
      const day = d.getDay();
      if (day !== 1) {
        d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
        measurementDate.value = d.toLocaleDateString('en-CA');
      }
    });

    userSelect.addEventListener('change', async () => {
      startingWeightKg = await loadStartingWeight(userSelect.value);
    });

    /* ── Unit‑field toggling ─────────────────────────── */

    function toggleUnitFields(unit) {
      document.getElementById('today-stlb').hidden = unit !== 'st-lb';
      document.getElementById('today-lb').hidden   = unit !== 'lb';
      document.getElementById('today-kg').hidden   = unit !== 'kg';
    }

    function clearHiddenFields(unit) {
      if (unit !== 'st-lb') { document.getElementById('today-stones').value = ''; document.getElementById('today-pounds').value = ''; }
      if (unit !== 'lb')    { document.getElementById('today-pounds-only').value = ''; }
      if (unit !== 'kg')    { document.getElementById('today-kilograms').value = ''; }
    }

    toggleUnitFields(weightUnit.value || 'st-lb');
    weightUnit.addEventListener('change', () => {
      clearHiddenFields(weightUnit.value);
      toggleUnitFields(weightUnit.value);
    });

    /* ── Calculate button ────────────────────────────── */

    function showError(msg) {
      resultContainer.hidden = false;
      resultText.textContent = msg;
      resultText.className = 'result-value';
      chartContainer.hidden = true;
    }

    const calcBtn = document.getElementById('calculate-btn');
    calcBtn.addEventListener('click', async () => {
      if (calcBtn.disabled) return;
      calcBtn.disabled = true;
      const user = userSelect.value;
      if (!user)  { calcBtn.disabled = false; return showError('Please select a user.'); }
      if (!weightUnit.value) { calcBtn.disabled = false; return showError('Please select input units.'); }

      if (!startingWeightKg || startingWeightKg <= 0) {
        startingWeightKg = await loadStartingWeight(user);
      }
      if (!startingWeightKg || startingWeightKg <= 0) { calcBtn.disabled = false; return showError('No starting weight set. Go to Setup first.'); }

      const todayKg = parseWeightInputs(weightUnit.value, {
        stones: 'today-stones', pounds: 'today-pounds',
        poundsOnly: 'today-pounds-only', kg: 'today-kilograms'
      });
      if (!todayKg || todayKg <= 0) { calcBtn.disabled = false; return showError('Enter a valid current weight.'); }

      const changePct = ((todayKg - startingWeightKg) / startingWeightKg) * 100;
      const formatted = Math.abs(changePct).toFixed(1);
      const isLoss = changePct < 0;
      resultText.textContent = isLoss
        ? `LOST ${formatted}% of your starting weight`
        : `GAINED ${formatted}% of your starting weight`;
      resultText.className = `result-value ${isLoss ? 'lost' : 'gained'}`;
      resultContainer.hidden = false;

      const selectedDate = measurementDate.value
        ? new Date(measurementDate.value).toISOString()
        : new Date().toISOString();
      await saveWeight(user, startingWeightKg, todayKg, changePct, selectedDate);

      const data = await loadWeightData(user);
      if (data.length) {
        renderChart('weightChart', data, chartContainer);
        chartContainer.hidden = false;
      } else {
        chartContainer.hidden = true;
      }
      calcBtn.disabled = false;
    });
  </script>
</body>
</html>
