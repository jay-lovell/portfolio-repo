<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+Pro:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <h1>Crossword Helper</h1>
      <p>Save clues and quickly filter by length and known letter positions.</p>
    </header>

    <section class="panel">
      <h2>Add entry</h2>
      <form id="entry-form" class="entry-form">
        <label for="clue-input">Clue</label>
        <input id="clue-input" type="text" maxlength="200" required />

        <label for="answer-input">Answer</label>
        <input id="answer-input" type="text" maxlength="40" required />

        <div class="meta-row">
          <span>Letter count:</span>
          <output id="letter-count-output">0</output>
        </div>

        <button type="submit">Save entry</button>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>Filters</h2>
      <div class="filter-row">
        <label for="length-filter">Letter count</label>
        <select id="length-filter">
          <option value="all">All lengths</option>
        </select>
      </div>

      <div>
        <p class="pattern-label">Known letters</p>
        <div id="pattern-boxes" class="pattern-boxes" aria-label="Crossword letter filter boxes"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Clues</h2>
      <p id="list-status" class="message" role="status" aria-live="polite"></p>
      <div id="clue-list" class="clue-list"></div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
