<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+Pro:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell" data-page="solve">
    <header class="hero">
      <h1>Crossword Helper</h1>
      <p>Enter known letters to filter clues.</p>
      <nav class="page-nav" aria-label="Crossword pages">
        <a class="nav-link current" href="./index.html" aria-current="page">Solve</a>
        <a class="nav-link" href="./add.html">Add clue</a>
      </nav>
    </header>

    <section class="panel">
      <h2>Filter grid</h2>
      <div class="filter-row">
        <label for="length-filter">Letter count</label>
        <select id="length-filter">
          <option value="all">All lengths</option>
        </select>
      </div>

      <div class="filter-row">
        <label for="clue-search">Clue text (optional)</label>
        <input id="clue-search" type="search" maxlength="200" placeholder="Type part of a clue" />
      </div>

      <div>
        <p class="pattern-label">Grid letters</p>
        <p class="helper-text">Type continuously. Use space for any letter in that position.</p>
        <div id="pattern-boxes" class="pattern-boxes" aria-label="Crossword letter filter boxes"></div>
      </div>
      <output id="list-status" class="message" aria-live="polite"></output>
      <output id="action-message" class="message" aria-live="polite"></output>
    </section>

    <section class="panel">
      <h2>Clues</h2>
      <div id="clue-list" class="clue-list"></div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
