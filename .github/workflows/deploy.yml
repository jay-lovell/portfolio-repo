name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Firebase config
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              'apiKey': os.environ['FIREBASE_API_KEY'],
              'authDomain': os.environ['FIREBASE_AUTH_DOMAIN'],
              'projectId': os.environ['FIREBASE_PROJECT_ID'],
              'storageBucket': os.environ['FIREBASE_STORAGE_BUCKET'],
              'messagingSenderId': os.environ['FIREBASE_MESSAGING_SENDER_ID'],
              'appId': os.environ['FIREBASE_APP_ID'],
              'measurementId': os.environ['FIREBASE_MEASUREMENT_ID'],
          }

          path = Path('weight/firebase-config.js')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(f"window.firebaseConfig = {json.dumps(config, indent=2)};\n", encoding='utf-8')
          print('WROTE', path)
          print(path.read_text())
          PY

      - name: Verify firebase config file
        run: |
          if [ ! -f weight/firebase-config.js ]; then
            echo "::error::firebase-config.js was not generated"
            exit 1
          fi
          if grep -q "__FIREBASE_" weight/firebase-config.js; then
            echo "::error::firebase-config.js still contains placeholder values"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
