<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="stylesheet" href="../main.css" />
  <link rel="stylesheet" href="./weightcalc.css" />
  <title>PRESC Weight Setup</title>
</head>
<body>
  <main class="page-shell" aria-label="Weight setup">
    <section class="auth-bar" aria-label="Authentication controls">
      <p id="auth-status" class="auth-status">Checking sign-in status…</p>
      <div class="auth-actions">
        <button id="signin-btn" type="button" class="auth-button">Sign in with Google</button>
        <button id="signout-btn" type="button" class="auth-button auth-button-secondary" hidden>Sign out</button>
      </div>
    </section>

    <section class="brand-bar">
      <div class="brand-logo-wrap">
        <img src="../images/presc-logo.jpeg" alt="PRESC logo" class="brand-logo" />
      </div>
      <div>
        <h1>PRESC Weight Setup</h1>
        <p class="intro">Set your starting weight to begin tracking</p>
      </div>
    </section>

    <div class="unit-switcher">
      <label for="user-select">Select User</label>
      <select id="user-select" aria-label="Select user" required>
        <option value="" disabled selected>Please select</option>
        <option value="Sarah">Sarah</option>
        <option value="Jay">Jay</option>
      </select>
    </div>

    <div class="unit-switcher">
      <label for="weight-unit">Weight Units</label>
      <select id="weight-unit" aria-label="Weight units" required>
        <option value="st-lb" selected>Stones & Pounds</option>
        <option value="lb">Pounds</option>
        <option value="kg">Kilograms</option>
      </select>
    </div>

    <section class="input-grid">
      <div class="weight-card">
        <h2>Starting Weight</h2>
        <div class="field-group">
          <div id="start-stlb" class="row columns-2">
            <div>
              <label for="start-stones">Stones</label>
              <input id="start-stones" type="number" min="0" step="1" inputmode="numeric" placeholder="st" />
            </div>
            <div>
              <label for="start-pounds">Pounds</label>
              <input id="start-pounds" type="number" min="0" step="0.1" inputmode="decimal" placeholder="lb" />
            </div>
          </div>

          <div id="start-lb" class="field-group" hidden>
            <label for="start-pounds-only">Pounds</label>
            <input id="start-pounds-only" type="number" min="0" step="0.1" inputmode="decimal" placeholder="lbs" />
          </div>

          <div id="start-kg" class="field-group" hidden>
            <label for="start-kilograms">Kilograms</label>
            <input id="start-kilograms" type="number" min="0" step="0.1" inputmode="decimal" placeholder="kg" />
          </div>
        </div>
      </div>
    </section>

    <button class="calculate-button" id="save-btn" type="button">Save Starting Weight</button>
    <a href="./index.html" class="note-text" style="display: block; color: #5fd3b9; text-decoration: none; margin-top: 12px;">→ Go to Calculator</a>
    <a href="./chart.html" class="note-text" style="display: block; color: #5fd3b9; text-decoration: none; margin-top: 8px;">→ View Competition Chart</a>

    <div id="result" class="result-box" hidden>
      <p id="result-text" class="result-value"></p>
    </div>
  </main>

  <script type="module">
    import {
      saveStartingWeight, parseWeightInputs,
      signInWithGoogle, signOutUser, onUserChanged
    } from './presc.js';

    const weightUnit  = document.getElementById('weight-unit');
    const userSelect  = document.getElementById('user-select');
    const resultContainer = document.getElementById('result');
    const resultText  = document.getElementById('result-text');
    const authStatus  = document.getElementById('auth-status');
    const signInBtn   = document.getElementById('signin-btn');
    const signOutBtn  = document.getElementById('signout-btn');
    const saveBtn     = document.getElementById('save-btn');
    const calcLink    = document.querySelector('a[href="./index.html"]');
    const chartLink   = document.querySelector('a[href="./chart.html"]');
    let currentUser   = null;

    /* ── Unit‑field toggling ─────────────────────────── */

    function toggleUnitFields(unit) {
      document.getElementById('start-stlb').hidden = unit !== 'st-lb';
      document.getElementById('start-lb').hidden   = unit !== 'lb';
      document.getElementById('start-kg').hidden   = unit !== 'kg';
    }

    function clearFields(unit) {
      if (unit !== 'st-lb') { document.getElementById('start-stones').value = ''; document.getElementById('start-pounds').value = ''; }
      if (unit !== 'lb')    { document.getElementById('start-pounds-only').value = ''; }
      if (unit !== 'kg')    { document.getElementById('start-kilograms').value = ''; }
    }

    toggleUnitFields(weightUnit.value || 'st-lb');
    weightUnit.addEventListener('change', () => {
      clearFields(weightUnit.value);
      toggleUnitFields(weightUnit.value);
    });

    /* ── Save button ─────────────────────────────────── */

    function showMessage(message, className = 'result-value') {
      resultContainer.hidden = false;
      resultText.textContent = message;
      resultText.className = className;
    }

    saveBtn.addEventListener('click', async () => {
      if (!currentUser) {
        showMessage('Please sign in with Google first.');
        return;
      }
      const user = userSelect.value;
      if (!user) {
        showMessage('Please select a user.');
        return;
      }
      if (!weightUnit.value) {
        showMessage('Please select weight units.');
        return;
      }

      const startKg = parseWeightInputs(weightUnit.value, {
        stones: 'start-stones', pounds: 'start-pounds',
        poundsOnly: 'start-pounds-only', kg: 'start-kilograms'
      });
      if (!startKg || startKg <= 0) {
        showMessage('Enter a valid starting weight.');
        return;
      }

      try {
        await saveStartingWeight(user, startKg, weightUnit.value);
        showMessage('✓ Starting weight saved!', 'result-value lost');
      } catch (error) {
        console.error('Error saving starting weight:', error);
        showMessage(error?.message || 'Error saving weight. Try again.', 'result-value gained');
      }
    });

    function setAuthState(user) {
      currentUser = user;
      const isSignedIn = Boolean(user);

      authStatus.textContent = isSignedIn
        ? `Signed in as ${user.displayName || user.email}`
        : 'Please sign in with Google to update starting weight.';
      signInBtn.hidden = isSignedIn;
      signOutBtn.hidden = !isSignedIn;
      saveBtn.disabled = !isSignedIn;
      userSelect.disabled = !isSignedIn;
      weightUnit.disabled = !isSignedIn;
      calcLink.style.pointerEvents = isSignedIn ? 'auto' : 'none';
      calcLink.style.opacity = isSignedIn ? '1' : '0.5';
      chartLink.style.pointerEvents = isSignedIn ? 'auto' : 'none';
      chartLink.style.opacity = isSignedIn ? '1' : '0.5';
    }

    signInBtn.addEventListener('click', async () => {
      try {
        await signInWithGoogle();
      } catch (error) {
        showMessage(error?.message || 'Sign-in failed. Please try again.');
      }
    });

    signOutBtn.addEventListener('click', async () => {
      try {
        await signOutUser();
      } catch (error) {
        showMessage(error?.message || 'Sign-out failed. Please try again.');
      }
    });

    onUserChanged(setAuthState);
  </script>
</body>
</html>
