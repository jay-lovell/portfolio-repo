<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="stylesheet" href="../main.css" />
  <link rel="stylesheet" href="./weightcalc.css" />
  <title>PRESC Weight Competition Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    .leaderboard-table th,
    .leaderboard-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .leaderboard-table thead th {
      color: #98a0b8;
      font-weight: 500;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .leaderboard-table tbody tr:last-child td {
      border-bottom: none;
    }
    .chart-label {
      font-size: 0.85rem;
      color: #98a0b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 0 10px;
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-label="Weight competition chart">
    <section class="auth-bar" aria-label="Authentication controls">
      <p id="auth-status" class="auth-status">Checking sign-in status…</p>
      <div class="auth-actions">
        <button id="signin-btn" type="button" class="auth-button">Sign in with Google</button>
        <button id="signout-btn" type="button" class="auth-button auth-button-secondary" hidden>Sign out</button>
      </div>
    </section>

    <section class="brand-bar">
      <div class="brand-logo-wrap">
        <img src="../images/presc-logo.jpeg" alt="PRESC logo" class="brand-logo" />
      </div>
      <div>
        <h1>PRESC Weight Competition Chart</h1>
        <p class="intro">Weekly progress and competition results.</p>
      </div>
    </section>

    <div id="leaderboard-container" class="result-box" style="margin-bottom:20px"></div>

    <div id="this-week-winner" class="result-box" style="margin-bottom:20px;text-align:center"></div>

    <div id="weekly-chart-container" class="result-box" style="margin-bottom:20px">
      <p class="chart-label">Weekly % of start weight lost</p>
      <canvas id="weeklyChart"></canvas>
    </div>

    <div id="chart-container" class="result-box">
      <p class="chart-label">Cumulative progress</p>
      <canvas id="weightChart"></canvas>
    </div>

    <a href="./index.html" class="note-text" style="display: block; color: #5fd3b9; text-decoration: none; margin-top: 16px;">→ Go to Calculator</a>
    <a href="./setup.html" class="note-text" style="display: block; color: #5fd3b9; text-decoration: none; margin-top: 8px;">→ Update Starting Weight</a>
  </main>
  <script type="module">
    import {
      loadWeightData, weeklyResults,
      renderChart, renderWeeklyBarChart, renderLeaderboard,
      signInWithGoogle, signOutUser, onUserChanged
    } from './presc.js';

    const container         = document.getElementById('chart-container');
    const weeklyContainer   = document.getElementById('weekly-chart-container');
    const leaderboardEl     = document.getElementById('leaderboard-container');
    const authStatus        = document.getElementById('auth-status');
    const signInBtn         = document.getElementById('signin-btn');
    const signOutBtn        = document.getElementById('signout-btn');
    const calculatorLink    = document.querySelector('a[href="./index.html"]');
    const setupLink         = document.querySelector('a[href="./setup.html"]');
    const thisWeekEl        = document.getElementById('this-week-winner');

    async function renderChartPage() {
      const data = await loadWeightData();
      if (data.length) {
        const results = weeklyResults(data);
        renderLeaderboard(data, results, leaderboardEl);

        const latest = results.at(-1);
        if (latest) {
          if (latest.winner) {
            const color = latest.winner === 'Sarah' ? '#ff69b4' : '#2196f3';
            thisWeekEl.innerHTML = `<p style="margin:0;font-size:0.85rem;color:#98a0b8;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">This week's winner</p><p style="margin:0;font-size:1.6rem;font-weight:700;color:${color}">👑 ${latest.winner}</p>`;
          } else if (latest.missing.length > 0) {
            const names = latest.missing.join(' and ');
            thisWeekEl.innerHTML = `<p style="margin:0;font-size:1rem;color:#ffb300">Waiting for ${names} to weigh in this week</p>`;
          } else {
            thisWeekEl.innerHTML = `<p style="margin:0;font-size:1rem;color:#98a0b8">This week is a draw!</p>`;
          }
        }

        renderWeeklyBarChart('weeklyChart', results);
        renderChart('weightChart', data, container);
      } else {
        leaderboardEl.innerHTML   = '<p class="note-text">No weight data recorded yet.</p>';
        thisWeekEl.innerHTML      = '';
        weeklyContainer.innerHTML = '';
        container.innerHTML       = '';
      }
    }

    function setAuthState(user) {
      const isSignedIn = Boolean(user);
      authStatus.textContent = isSignedIn
        ? `Signed in as ${user.displayName || user.email}`
        : 'Please sign in with Google to view the competition chart.';
      signInBtn.hidden = isSignedIn;
      signOutBtn.hidden = !isSignedIn;
      calculatorLink.style.pointerEvents = isSignedIn ? 'auto' : 'none';
      calculatorLink.style.opacity = isSignedIn ? '1' : '0.5';
      setupLink.style.pointerEvents = isSignedIn ? 'auto' : 'none';
      setupLink.style.opacity = isSignedIn ? '1' : '0.5';

      if (isSignedIn) {
        renderChartPage();
      } else {
        leaderboardEl.innerHTML = '<p class="note-text">Sign in to view competition data.</p>';
        thisWeekEl.innerHTML = '';
        weeklyContainer.innerHTML = '';
        container.innerHTML = '';
      }
    }

    signInBtn.addEventListener('click', async () => {
      try {
        await signInWithGoogle();
      } catch (error) {
        leaderboardEl.innerHTML = `<p class="note-text">${error?.message || 'Sign-in failed. Please try again.'}</p>`;
      }
    });

    signOutBtn.addEventListener('click', async () => {
      try {
        await signOutUser();
      } catch (error) {
        leaderboardEl.innerHTML = `<p class="note-text">${error?.message || 'Sign-out failed. Please try again.'}</p>`;
      }
    });

    onUserChanged(setAuthState);
  </script>
</body>
</html>
