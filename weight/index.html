<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="stylesheet" href="../main.css" />
  <link rel="stylesheet" href="./weightcalc.css" />
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>PRESC Weight Change Calculator</title>
</head>
<body>
  <main class="page-shell" aria-label="Weight change calculator">
    <section class="brand-bar">
      <div class="brand-logo-wrap">
        <img src="../images/presc-logo.jpeg" alt="PRESC logo" class="brand-logo" />
      </div>
      <div>
        <h1>PRESC Weight Change Calculator</h1>
        <p class="intro">Choose one measurement system and enter both weights in that same unit.</p>
      </div>
    </section>

    <div class="unit-switcher">
      <label for="weight-unit">Input units</label>
      <select id="weight-unit" aria-label="Weight input units">
        <option value="st-lb">Stones & Pounds</option>
        <option value="lb">Pounds</option>
        <option value="kg">Kilograms</option>
      </select>
    </div>

    <div class="unit-switcher">
      <label for="user-select">Select User</label>
      <select id="user-select" aria-label="Select user">
        <option value="Sarah">Sarah</option>
        <option value="Jay">Jay</option>
      </select>
    </div>

    <section class="input-grid">
      <div class="weight-card">
        <h2>Starting Weight</h2>
        <div class="field-group">
          <div id="start-stlb" class="row columns-2">
            <div>
              <label for="start-stones">Stones</label>
              <input id="start-stones" type="number" min="0" step="1" inputmode="numeric" placeholder="st" />
            </div>
            <div>
              <label for="start-pounds">Pounds</label>
              <input id="start-pounds" type="number" min="0" step="0.1" inputmode="decimal" placeholder="lb" />
            </div>
          </div>

          <div id="start-lb" class="field-group" hidden>
            <label for="start-pounds-only">Pounds</label>
            <input id="start-pounds-only" type="number" min="0" step="0.1" inputmode="decimal" placeholder="lbs" />
          </div>

          <div id="start-kg" class="field-group" hidden>
            <label for="start-kilograms">Kilograms</label>
            <input id="start-kilograms" type="number" min="0" step="0.1" inputmode="decimal" placeholder="kg" />
          </div>
        </div>
      </div>

      <div class="weight-card">
        <h2>Today's Weight</h2>
        <div class="field-group">
          <div id="today-stlb" class="row columns-2">
            <div>
              <label for="today-stones">Stones</label>
              <input id="today-stones" type="number" min="0" step="1" inputmode="numeric" placeholder="st" />
            </div>
            <div>
              <label for="today-pounds">Pounds</label>
              <input id="today-pounds" type="number" min="0" step="0.1" inputmode="decimal" placeholder="lb" />
            </div>
          </div>

          <div id="today-lb" class="field-group" hidden>
            <label for="today-pounds-only">Pounds</label>
            <input id="today-pounds-only" type="number" min="0" step="0.1" inputmode="decimal" placeholder="lbs" />
          </div>

          <div id="today-kg" class="field-group" hidden>
            <label for="today-kilograms">Kilograms</label>
            <input id="today-kilograms" type="number" min="0" step="0.1" inputmode="decimal" placeholder="kg" />
          </div>
        </div>
      </div>
    </section>

    <button class="calculate-button" id="calculate-btn" type="button">Calculate</button>

    <div id="result" class="result-box" hidden>
      <p class="result-copy">Cumulative change from your starting weight</p>
      <p id="result-text" class="result-value"></p>
    </div>

    <div id="chart-container" class="result-box" hidden>
      <canvas id="weightChart"></canvas>
    </div>
  </main>

  <script>
    // Firebase configuration - Replace with your own Firebase project config
    const firebaseConfig = {
      apiKey: "your-api-key",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project-id",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "123456789",
      appId: "your-app-id"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function saveWeightData(user, startKg, todayKg, changePct) {
      try {
        await addDoc(collection(db, 'weightData'), {
          user: user,
          date: new Date().toISOString(),
          startWeight: startKg,
          todayWeight: todayKg,
          changePct: changePct
        });
      } catch (error) {
        console.error('Error saving data:', error);
      }
    }

    async function loadWeightData(user) {
      try {
        const q = query(collection(db, 'weightData'), where('user', '==', user), orderBy('date'));
        const querySnapshot = await getDocs(q);
        const data = [];
        querySnapshot.forEach((doc) => {
          data.push(doc.data());
        });
        return data;
      } catch (error) {
        console.error('Error loading data:', error);
        return [];
      }
    }

    function plotChart(data) {
      const ctx = document.getElementById('weightChart').getContext('2d');
      const labels = data.map(d => new Date(d.date).toLocaleDateString());
      const values = data.map(d => d.changePct);
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Weight Change %',
            data: values,
            borderColor: '#5fd3b9',
            backgroundColor: 'rgba(95,211,185,0.1)',
            fill: true
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }
    const weightUnit = document.getElementById('weight-unit');
    const prefixes = ['start', 'today'];

    function toggleUnitFields(unit) {
      prefixes.forEach(prefix => {
        const stlb = document.getElementById(`${prefix}-stlb`);
        const lb = document.getElementById(`${prefix}-lb`);
        const kg = document.getElementById(`${prefix}-kg`);

        stlb.hidden = unit !== 'st-lb';
        lb.hidden = unit !== 'lb';
        kg.hidden = unit !== 'kg';
      });
    }

    function clearHiddenFields(unit) {
      prefixes.forEach(prefix => {
        if (unit !== 'st-lb') {
          document.getElementById(`${prefix}-stones`).value = '';
          document.getElementById(`${prefix}-pounds`).value = '';
        }
        if (unit !== 'lb') {
          document.getElementById(`${prefix}-pounds-only`).value = '';
        }
        if (unit !== 'kg') {
          document.getElementById(`${prefix}-kilograms`).value = '';
        }
      });
    }

    toggleUnitFields(weightUnit.value);
    weightUnit.addEventListener('change', () => {
      clearHiddenFields(weightUnit.value);
      toggleUnitFields(weightUnit.value);
    });

    function parseWeight(prefix) {
      const unit = weightUnit.value;
      if (unit === 'st-lb') {
        const stones = parseFloat(document.getElementById(`${prefix}-stones`).value) || 0;
        const pounds = parseFloat(document.getElementById(`${prefix}-pounds`).value) || 0;
        return stones * 6.35029 + pounds * 0.45359237;
      }
      if (unit === 'lb') {
        return (parseFloat(document.getElementById(`${prefix}-pounds-only`).value) || 0) * 0.45359237;
      }
      return parseFloat(document.getElementById(`${prefix}-kilograms`).value) || 0;
    }

    document.getElementById('calculate-btn').addEventListener('click', async () => {
      const startKg = parseWeight('start');
      const todayKg = parseWeight('today');
      const resultContainer = document.getElementById('result');
      const resultText = document.getElementById('result-text');
      const chartContainer = document.getElementById('chart-container');
      const user = document.getElementById('user-select').value;

      if (!startKg || startKg <= 0 || !todayKg || todayKg <= 0) {
        resultContainer.hidden = false;
        resultText.textContent = 'Enter valid weights in both fields.';
        resultText.className = 'result-value';
        chartContainer.hidden = true;
        return;
      }

      const changePct = ((todayKg - startKg) / startKg) * 100;
      const formatted = Math.abs(changePct).toFixed(1);
      const isLoss = changePct < 0;
      resultText.textContent = isLoss
        ? `LOST ${formatted}% of your starting weight`
        : `GAINED ${formatted}% of your starting weight`;
      resultText.className = `result-value ${isLoss ? 'lost' : 'gained'}`;
      resultContainer.hidden = false;

      // Save data
      await saveWeightData(user, startKg, todayKg, changePct);

      // Load and plot chart
      const data = await loadWeightData(user);
      if (data.length > 0) {
        plotChart(data);
        chartContainer.hidden = false;
      } else {
        chartContainer.hidden = true;
      }
    });
  </script>
</body>
</html>
